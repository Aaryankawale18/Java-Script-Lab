<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOM Timer</title>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            margin-top: 150px;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }
        
        #timer {
            font-size: 7rem;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            transition: all 0.3s ease;
        }

        /* Boom state text */
        .boom-text {
            font-size: 8rem;
            color: #ff3333;
            animation: shake 0.5s infinite, pop 0.3s ease-out;
            text-shadow: 0 0 30px #ff3333, 0 0 60px #ff0000;
        }

        /* Explosion symbol */
        .boom-graphic {
            font-size: 10rem;
            margin-top: 20px;
            animation: explode 0.5s forwards;
        }

        /* Quick shake animation for impact */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Target areas for JavaScript -->
    <div id="timer">10</div>
    <div id="graphic-container"></div>

    <script>
        // Exact 20 seconds configuration
        let timeLeft = 10; 

        const countdown = () => {
            const timerEl = document.getElementById("timer");
            const graphicEl = document.getElementById("graphic-container");

            // Jab time bacha ho
            if (timeLeft > 0) {
                timerEl.innerHTML = timeLeft;
                
                // Last 5 seconds mein color change warning ke liye
                if (timeLeft <= 5) {
                    timerEl.style.color = "#ff3333";
                }
                timeLeft--;
            } 
            // Jab time khatam ho jaye (BOOM!)
            else {
                clearInterval(timerInterval);
                
                // Clear original numbers and inject the explosion state
                timerEl.innerHTML = "BOOM!";
                timerEl.className = "boom-text";
                
                // Displaying dynamic functional emoji graphic element
                graphicEl.innerHTML = "💥";
                graphicEl.className = "boom-graphic";
            }
        };

        // Standard ES6 interval trigger (runs every 1 second)
        const timerInterval = setInterval(countdown, 1000);
    </script>

</body>
</html>
