<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Shift Class Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .class-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* Active Class Highlighting */
        .class-card.active-now {
            border: 2px solid #2ed573;
            background-color: #15291c;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.2);
            transform: scale(1.01);
        }

        .class-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .class-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .prof-name {
            color: #aaa;
            font-size: 0.95rem;
        }

        .duration-info {
            color: #1a73e8;
            font-weight: bold;
            font-size: 1rem;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-live { background-color: #2ed573; color: #000; }
        .status-upcoming { background-color: #ffa502; color: #000; }
        .status-completed { background-color: #57606f; color: #fff; }

        .timer-box {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 140px;
            text-align: right;
        }

        .timer-label {
            font-size: 0.75rem;
            color: #aaa;
            display: block;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <h1>📚 Auto-Shift Class Dashboard</h1>
    <p class="subtitle">Classes will shift automatically one after another</p>

    <div id="dashboard" class="dashboard"></div>

    <script>
        // --- APNE MANN SE CLASSES AUR UNKA DURATION (Seconds mein) SET KAREIN ---
        // Test karne ke liye maine kam seconds dale hain, aap isko badha sakte hain (e.g. 30 minutes = 1800)
        const classesData = [
            { name: "Physics 101", prof: "Dr. H.C. Verma", durationSeconds: 15 },
            { name: "Organic Chemistry", prof: "Prof. Alok Kumar", durationSeconds: 10 },
            { name: "Advanced Calculus", prof: "Dr. S.K. Mitra", durationSeconds: 12 },
            { name: "Data Structures (DSA)", prof: "Er. Sandeep Jain", durationSeconds: 20 },
            { name: "Web Development", prof: "Sheryasi Ma'am", durationSeconds: 15 }
        ];

        // Is variable se track hoga ki abhi kaun si class chal rahi hai (0 matlab 1st class)
        let currentClassIndex = 0;

        // UI rendering function using ES6 arrow functions and map
        const renderClasses = () => {
            const dashboardEl = document.getElementById("dashboard");
            
            dashboardEl.innerHTML = classesData.map((cls, index) => {
                let status = "Upcoming";
                let badgeStyle = "status-upcoming";
                let cardClass = "";
                let timerText = "";
                let labelText = "Waiting";

                // 1. Agar class index current index se peeche hai -> Completed
                if (index < currentClassIndex) {
                    status = "Completed";
                    badgeStyle = "status-completed";
                    timerText = "🏁 OVER";
                    labelText = "Finished";
                } 
                // 2. Agar class index current index ke barabar hai -> Live Chal rahi hai
                else if (index === currentClassIndex) {
                    status = "Live";
                    badgeStyle = "status-live";
                    cardClass = "active-now";
                    labelText = "Time Left";

                    const mins = Math.floor(cls.durationSeconds / 60);
                    const secs = cls.durationSeconds % 60;
                    timerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                } 
                // 3. Agar class aage aane wali hai -> Upcoming
                else {
                    status = "Upcoming";
                    badgeStyle = "status-upcoming";
                    const mins = Math.floor(cls.durationSeconds / 60);
                    const secs = cls.durationSeconds % 60;
                    timerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    labelText = "Duration";
                }

                return `
                    <div class="class-card ${cardClass}">
                        <div class="class-info">
                            <div class="class-name">${cls.name}</div>
                            <div class="prof-name">👨‍🏫 ${cls.prof}</div>
                            <div class="duration-info">⏱ Total Time: ${Math.floor(cls.durationSeconds / 60)}m ${cls.durationSeconds % 60}s</div>
                        </div>
                        <div>
                            <span class="status-badge ${badgeStyle}">${status}</span>
                        </div>
                        <div class="timer-box">
                            <span class="timer-label">${labelText}</span>
                            <span style="color: ${status === 'Live' ? '#2ed573' : (status === 'Upcoming' ? '#ffa502' : '#57606f')}">
                                ${timerText}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // Master loop jo har second chalega aur active class ka time kam karega
        const startSequence = () => {
            setInterval(() => {
                // Agar saari classes khatam ho gayi hain toh loop rok do
                if (currentClassIndex >= classesData.length) {
                    return;
                }

                // Active class ka 1 second kam karo
                classesData[currentClassIndex].durationSeconds--;

                // Agar active class ka timer 0 ho gaya, toh next class par shift karo
                if (classesData[currentClassIndex].durationSeconds < 0) {
                    currentClassIndex++; 
                }

                // Screen ko update karo naye time ke sath
                renderClasses();
            }, 1000);
        };

        // Page load hote hi program ko start karne ke liye code
        document.addEventListener("DOMContentLoaded", () => {
            renderClasses();   // Pehle layout draw hoga
            startSequence();   // Phir countdown chalu ho jayega
        });
    </script>
</body>
</html>
