<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> To-Do List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Black and white aesthetic brick wall with dark gradient overlay */
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                  url('https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .todo-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .todo-card h2 {
      text-align: center;
      color: #1a202c;
      letter-spacing: 0.5px;
      font-size: 24px;
      margin-bottom: 22px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .input-section input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-section input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .input-section button {
      background: #18181b;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .input-section button:hover {
      background: #27272a;
      transform: translateY(-1px);
    }

    .task-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .task-list::-webkit-scrollbar {
      width: 5px;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .task-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin-right: 12px;
      accent-color: #2563eb;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .task-title {
      font-size: 14.5px;
      color: #1e293b;
      font-weight: 500;
      word-break: break-word;
    }

    .status-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-completed {
      color: #2563eb;
    }

    .status-ongoing {
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }

    .btn-edit, .btn-delete {
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-edit {
      background: #fef08a;
      color: #713f12;
    }

    .btn-delete {
      background: #fecdd3;
      color: #881337;
    }

    .btn-edit:hover, .btn-delete:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="todo-card">
    <h2>Aaryan 1162</h2>
    
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add Task</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];

    function saveTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item';

        li.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <div class="task-content">
            <span class="task-title">${task.text}</span>
            <span class="status-tag ${task.completed ? 'status-completed' : 'status-ongoing'}">
              ${task.completed ? 'Completed' : 'Ongoing'}
            </span>
          </div>
          <div class="actions">
            <button class="btn-edit" onclick="editTask(${index})">Edit</button>
            <button class="btn-delete" onclick="deleteTask(${index})">Delete</button>
          </div>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') return;

      tasks.push({ text: text, completed: false });
      saveTasks();
      renderTasks();
      taskInput.value = '';
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function editTask(index) {
      const newText = prompt('Task edit karein:', tasks[index].text);
      if (newText !== null && newText.trim() !== '') {
        tasks[index].text = newText.trim();
        saveTasks();
        renderTasks();
      }
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    taskInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    renderTasks();
  </script>
</body>
</html>
