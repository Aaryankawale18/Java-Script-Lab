
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Palindrome & Strength Checker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --warning-bg: #451a03;
      --warning-text: #fde047;
      --warning-border: #854d0e;
      --success-bg: #064e3b;
      --success-text: #6ee7b7;
      --success-border: #047857;
      --error-bg: #450a0a;
      --error-text: #fca5a5;
      --error-border: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text-main);
      text-align: center;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 60px 12px 16px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      background-color: #0f172a;
      color: var(--text-main);
      border: 2px solid #334155;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      width: auto;
    }

    .toggle-btn:hover {
      color: var(--text-main);
      background-color: transparent;
    }

    button.btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn-submit:hover {
      background-color: var(--primary-hover);
    }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
      word-break: break-word;
      border: 1px solid transparent;
    }

    #result.warning {
      display: block;
      background-color: var(--warning-bg);
      color: var(--warning-text);
      border-color: var(--warning-border);
    }

    #result.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    #result.error {
      display: block;
      background-color: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Password Security Checker</h1>
    <p class="subtitle">Check if your password is a vulnerable palindrome</p>

    <div class="input-group">
      <div class="password-wrapper">
        <input type="text" id="passwordInput" placeholder="Enter password..." />
        <button type="button" class="toggle-btn" id="toggleBtn" onclick="toggleVisibility()">Hide</button>
      </div>
      <button class="btn-submit" onclick="checkPassword()">Check Password</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    let actualPassword = "";
    let isHidden = false;

    const inputElement = document.getElementById("passwordInput");

    // Intercept input changes to support custom asterisk masking
    inputElement.addEventListener("input", function(e) {
      if (isHidden) {
        // If characters were added or deleted
        const diff = e.target.value.length - actualPassword.length;
        
        if (diff > 0) {
          // Characters added
          const addedChars = e.target.value.slice(actualPassword.length);
          actualPassword += addedChars;
        } else if (diff < 0) {
          // Characters removed (Backspace)
          actualPassword = actualPassword.slice(0, e.target.value.length);
        }

        // Render asterisks in the input display
        inputElement.value = "*".repeat(actualPassword.length);
      } else {
        actualPassword = e.target.value;
      }
    });

    function toggleVisibility() {
      const btn = document.getElementById("toggleBtn");

      if (!isHidden) {
        // Switch to Hidden mode -> replace characters with *
        isHidden = true;
        inputElement.value = "*".repeat(actualPassword.length);
        btn.textContent = "Show";
      } else {
        // Switch to Visible mode -> show raw password
        isHidden = false;
        inputElement.value = actualPassword;
        btn.textContent = "Hide";
      }
    }

    function checkPassword() {
      const resultElement = document.getElementById("result");
      const password = actualPassword;

      if (!password) {
        resultElement.className = "error";
        resultElement.textContent = "Please enter a password first!";
        return;
      }

      // Reverse exact password
      const reversedPassword = password.split("").reverse().join("");

      // Check if exact palindrome
      if (password === reversedPassword) {
        resultElement.className = "warning";
        resultElement.innerHTML = "⚠️ <strong>Weak password!</strong> It is a palindrome. Choose a strong password.";
      } else {
        resultElement.className = "success";
        resultElement.innerHTML = "🔒 <strong>It is a strong non-palindrome password.</strong>";
      }
    }

    // Trigger check on Enter key press
    inputElement.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
