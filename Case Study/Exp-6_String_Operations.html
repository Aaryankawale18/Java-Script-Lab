<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Operations - Single Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }
        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #e8f8f5;
            border-left: 4px solid #1abc9c;
            border-radius: 2px;
            word-wrap: break-word;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>String Operations</h2>
    
    <label for="inputText">Enter your String / Paragraph:</label>
    <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
    
    <div class="btn-group">
        <button onclick="processBoth()">Run Both Operations</button>
        <button onclick="reverseOnly()" style="background-color: #7f8c8d;">Reverse Only</button>
        <button onclick="countVowelsOnly()" style="background-color: #7f8c8d;">Count Vowels Only</button>
    </div>

    <div id="outputArea" class="result-box"></div>
</div>

<script>
    // 1. Task: Reverse the string using split()
    function getReversedString(text) {
        // split('') divides the string into an array of characters
        return text.split("").reverse().join("");
    }

    // 2. Task: Count vowels using substring() and indexOf()
    function getVowelCount(text) {
        const vowels = "aeiouAEIOU";
        let vowelCount = 0;

        for (let i = 0; i < text.length; i++) {
            // substring() extracts a single character
            let currentChar = text.substring(i, i + 1);

            // indexOf() checks if the character is inside the vowel list
            if (vowels.indexOf(currentChar) !== -1) {
                vowelCount++;
            }
        }
        return vowelCount;
    }

    // UI Handler: Run both tasks together on the single text input
    function processBoth() {
        const text = document.getElementById("inputText").value;
        const output = document.getElementById("outputArea");

        if (text.trim() === "") {
            output.style.display = "block";
            output.innerHTML = "<em>Please enter some text first.</em>";
            return;
        }

        const reversed = getReversedString(text);
        const vowelCount = getVowelCount(text);

        output.style.display = "block";
        output.innerHTML = `
            <strong>Reversed Text:</strong><br>${reversed}<br><br>
            <strong>Total Vowels:</strong> ${vowelCount}
        `;
    }

    // Individual Handlers (optional shortcuts)
    function reverseOnly() {
        const text = document.getElementById("inputText").value;
        const output = document.getElementById("outputArea");
        output.style.display = "block";
        output.innerHTML = `<strong>Reversed Text:</strong><br>${getReversedString(text)}`;
    }

    function countVowelsOnly() {
        const text = document.getElementById("inputText").value;
        const output = document.getElementById("outputArea");
        output.style.display = "block";
        output.innerHTML = `<strong>Total Vowels:</strong> ${getVowelCount(text)}`;
    }
</script>

</body>
</html>
