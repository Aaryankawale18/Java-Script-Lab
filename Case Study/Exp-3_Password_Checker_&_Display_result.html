<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f8fafc;
    }

    /* Split Screen Layout */
    .section-left {
      flex: 1;
      padding: 40px 20px;
      background: #ffffff;
      border-right: 2px solid #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .section-right {
      flex: 1;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Form Design */
    .box {
      width: 100%;
      max-width: 320px;
    }

    h2 {
      margin-bottom: 20px;
      color: #0f172a;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px;
      border-radius: 6px;
      margin-top: 12px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    /* Result Card Design */
    .placeholder {
      color: #64748b;
      font-size: 16px;
    }

    .result-card {
      display: none;
      background: white;
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 260px;
    }

    .status {
      background: #d1fae5;
      color: #065f46;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .gpa {
      font-size: 48px;
      font-weight: 800;
      color: #2563eb;
    }

    .label {
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- LEFT COLUMN: PASSWORD INPUT -->
  <div class="section-left">
    <div class="box">
      <h2>Student Login</h2>
      <form id="loginForm">
        <label for="passInput">Password</label>
        <!-- type="text" की वजह से पासवर्ड टाइप करते वक्त दिखता रहेगा -->
        <input type="text" id="passInput" placeholder="Enter password..." required autocomplete="off">
        <button type="submit">Submit</button>
      </form>
      <div id="errorMsg" class="error">Incorrect Password!</div>
    </div>
  </div>

  <!-- RIGHT COLUMN: RESULT DISPLAY -->
  <div class="section-right">
    <div id="placeholder" class="placeholder">🔒 Enter correct password to view result</div>
    
    <div id="resultCard" class="result-card">
      <span class="status">Pass</span>
      <div class="gpa">9</div>
      <div class="label">GPA</div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const TARGET_PASS = "Aaryan1162";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const inputVal = document.getElementById("passInput").value.trim();
      
      const isCorrect = (inputVal === TARGET_PASS);

      document.getElementById("errorMsg").style.display = isCorrect ? "none" : "block";
      document.getElementById("resultCard").style.display = isCorrect ? "block" : "none";
      document.getElementById("placeholder").style.display = isCorrect ? "none" : "block";
    });
  </script>

</body>
</html>
